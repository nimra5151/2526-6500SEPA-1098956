<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TutorBridge — You're Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #eef2ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 2rem;
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; color: #1e293b; }
    p  { font-size: 0.925rem; color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #fef3c7;
      color: #92400e;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.75rem;
    }
    .dot { width: 8px; height: 8px; background: #f59e0b; border-radius: 50%; display: inline-block; }
    button {
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 0.625rem;
      padding: 0.75rem 1.75rem;
      font-size: 0.925rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background: #4f46e5; }
    .footer { margin-top: 1.5rem; font-size: 0.78rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <div class="badge"><span class="dot"></span> No internet connection</div>
    <h1>You're offline</h1>
    <p>TutorBridge needs an internet connection to load new content. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
    <p class="footer">TutorBridge — Free tutoring for every student</p>
  </div>
</body>
</html>
